<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProfClick</title>
    <meta name="description" content="Il piano di lavoro del docente, lezione per lezione: programma, verifiche e voti per quadrimestre." />
    <!-- L'app è personale: si indicizza la pagina pubblica (/), non questa. -->
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://profclick.federicodiluca.com/" />
    <meta name="author" content="Federico Di Luca" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#2f5b4f" />
    <script>
      // Il tema prima del primo disegno, per non lampeggiare: la scelta fatta nell'app
      // (src/state/theme.ts), altrimenti quella del sistema, che si segue anche se cambia.
      ;(function () {
        var system = matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var choice
          try {
            choice = localStorage.getItem('profclick-theme')
          } catch (e) {}
          var dark = choice === 'dark' || (choice !== 'light' && system.matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = dark ? '#050807' : '#2f5b4f'
          })
        }
        apply()
        system.addEventListener('change', apply)
        window.addEventListener('storage', apply)
        window.profclickApplyTheme = apply
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
